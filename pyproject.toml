[project]
name = "guitar-practice-logger"
version = "0.1.0"
description = "ギター練習の録音を取り込み、記録・公開するツール"
readme = "README.md"
authors = [
    { name = "pyonkichi499", email = "hrs499944@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
    "tomli-w>=1.2.0",
]

[project.scripts]
gpl = "guitar_practice_logger.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
