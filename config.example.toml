# ~/.config/guitar-practice-logger/config.toml にコピーして使う（環境変数 GPL_CONFIG で場所を変更可）

# DAW が曲ごとに書き出すフォルダの親（Windows 側）
songs_root = "/mnt/c/Users/hiroshi/Music/GuitarPractice/songs"

# 取り込んだ WAV の移動先（Windows 側）
